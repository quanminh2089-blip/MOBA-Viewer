name: Build Godot MOBA 1V1 APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'godot/**'
      - 'tools/convert_fbx.py'
      - 'Assets/Art/SceneModel/**'
      - '.github/workflows/godot-android.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy

      - name: Convert FBX map to GLB
        run: |
          blender -b --python-exit-code 1 --python tools/convert_fbx.py
          test -s output/1V1.glb
          mkdir -p godot/map
          cp output/1V1.glb godot/map/1V1.glb

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"

          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Configure Android export
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.config/godot"

          keytool -genkeypair \
            -keystore "$HOME/debug.keystore" \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

          cat > godot/export_presets.cfg <<'EOF'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="../build/MOBA-1V1.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]

          gradle_build/use_gradle_build=false
          package/unique_name="com.minhquan.moba1v1viewer"
          package/name="MOBA 1V1 Viewer"
          package/min_sdk=23
          package/target_sdk=35
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          keystore/debug=""
          keystore/debug_user=""
          keystore/debug_password=""
          permissions/internet=false
          EOF

          echo "=== ANDROID CONFIG ==="
          cat godot/export_presets.cfg

      - name: Import game
        run: |
          godot --headless --path godot --import

      - name: Validate game
        shell: bash
        run: |
          set -e
          godot --headless --path godot --quit-after 2 \
            > game-validation.log 2>&1 || {
              cat game-validation.log
              exit 1
            }
          cat game-validation.log

          if grep -E "SCRIPT ERROR|Parse Error" game-validation.log; then
            exit 1
          fi

      - name: Test clean Android export
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/clean-godot build

          cat > /tmp/clean-godot/project.godot <<'EOF'
          config_version=5

          [application]
          config/name="Android Export Test"
          run/main_scene="res://main.tscn"

          [rendering]
          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          EOF

          cat > /tmp/clean-godot/main.tscn <<'EOF'
          [gd_scene format=3]

          [node name="Main" type="Node2D"]
          EOF

          cp godot/export_presets.cfg /tmp/clean-godot/export_presets.cfg

          godot --headless --path /tmp/clean-godot --import

          godot --headless --verbose \
            --path /tmp/clean-godot \
            --export-debug Android \
            "$GITHUB_WORKSPACE/build/Android-Test.apk" \
            > build/clean-export.log 2>&1 || {
              cat build/clean-export.log
              exit 1
            }

          test -s build/Android-Test.apk
          echo "CLEAN APK SUCCESS"

      - name: Export MOBA Android APK
        shell: bash
        run: |
          set -e
          godot --headless --verbose \
            --path godot \
            --export-debug Android \
            "$GITHUB_WORKSPACE/build/MOBA-1V1.apk" \
            > build/game-export.log 2>&1 || {
              cat build/game-export.log
              exit 1
            }

          test -s build/MOBA-1V1.apk
          echo "MOBA APK SUCCESS"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MOBA-1V1-Android-APK
          path: build/MOBA-1V1.apk
          if-no-files-found: error

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Godot-Build-Logs
          path: |
            build/*.log
            game-validation.log
          if-no-files-found: ignore
