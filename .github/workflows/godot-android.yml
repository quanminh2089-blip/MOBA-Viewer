name: Build Godot MOBA 1V1 APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'godot/**'
      - 'tools/convert_fbx.py'
      - 'Assets/Art/SceneModel/**'
      - '.github/workflows/godot-android.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy

      - name: Convert Unity map
        run: |
          blender -b --python-exit-code 1 --python tools/convert_fbx.py
          test -s output/1V1.glb
          mkdir -p godot/map
          cp output/1V1.glb godot/map/1V1.glb

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android packages
        shell: bash
        run: |
          set -e
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: Android sdkmanager not found"
            find "$ANDROID_HOME" -maxdepth 3 -type d
            exit 1
          fi

          echo "Using SDK manager: $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Configure Godot Android paths
        run: |
          mkdir -p ~/.config/godot

          keytool -genkeypair -v \
            -keystore "$HOME/debug.keystore" \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

          cat > ~/.config/godot/editor_settings-4.4.tres <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SETTINGS

      - name: Configure Android export signing
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          p = Path("godot/export_presets.cfg")
          s = p.read_text()
          s = s.replace(
              'keystore/debug=""',
              'keystore/debug="/home/runner/debug.keystore"'
          )
          s = s.replace(
              'keystore/debug_password=""',
              'keystore/debug_password="android"'
          )
          p.write_text(s)
          print("Android debug signing configured")
          PYCODE

      - name: Import Godot project
        run: |
          cd godot
          godot --headless --path . --import

      - name: Diagnose Godot Android export
        run: |
          echo "=== GODOT VERSION ==="
          godot --version

          echo "=== EXPORT TEMPLATES ==="
          find "$HOME/.local/share/godot/export_templates" -maxdepth 3 -type f | head -40

          echo "=== ANDROID SDK ==="
          ls -la "$ANDROID_HOME"
          ls -la "$ANDROID_HOME/platforms"
          ls -la "$ANDROID_HOME/build-tools"

          echo "=== JAVA ==="
          java -version

          echo "=== KEYSTORE ==="
          test -s "$HOME/debug.keystore"

          echo "=== GODOT EDITOR SETTINGS ==="
          cat "$HOME/.config/godot/editor_settings-4.4.tres"

          echo "=== EXPORT PRESET ==="
          cat godot/export_presets.cfg

          echo "=== PROJECT VALIDATION ==="
          godot --headless --editor --path godot --quit

      - name: Validate game startup
        run: |
          cd godot
          set +e
          timeout 90s godot --headless --path . --quit-after 2 > ../godot-validation.log 2>&1
          STATUS=$?
          set -e
          cat ../godot-validation.log
          if grep -E "SCRIPT ERROR|Parse Error" ../godot-validation.log; then
            echo "GDScript validation failed"
            exit 1
          fi
          if [ "$STATUS" -ne 0 ]; then
            echo "Godot startup failed: $STATUS"
            exit "$STATUS"
          fi

      - name: Export Android APK
        run: |
          mkdir -p build
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER="androiddebugkey"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD="android"
          cd godot
          godot --headless --verbose --path . --export-debug Android ../build/MOBA-1V1.apk
          test -s ../build/MOBA-1V1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MOBA-1V1-Godot-APK
          path: build/MOBA-1V1.apk
          if-no-files-found: error
